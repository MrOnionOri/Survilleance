services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: streamwatch
      POSTGRES_PASSWORD: streamwatch
      POSTGRES_DB: streamwatch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamwatch"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://streamwatch:streamwatch@db:5432/streamwatch
      JWT_SECRET: change-me-in-production
      ADMIN_EMAIL: admin@streamwatch.example.com
      ADMIN_PASSWORD: admin123
      STREAMWATCH_DATA_DIR: /data
    ports:
      - "8000:8000"
    volumes:
      - ./events:/data/events
      - ./recordings:/data/recordings
      - ./snapshots:/data/snapshots
      - ./dataset:/data/dataset
      - ./models:/data/models
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)\""]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: ./worker
    profiles:
      - worker
    environment:
      BACKEND_URL: http://backend:8000
      WORKER_EMAIL: admin@streamwatch.example.com
      WORKER_PASSWORD: admin123
      WORKER_POLL_SECONDS: 10
      CAPTURE_FPS: 5
      CHUNK_SECONDS: 60
      SNAPSHOT_EVERY_SECONDS: 2
      STREAM_WS_EVERY_SECONDS: 0.25
      WORKER_SOURCE_SCOPE: network
      STREAMWATCH_DATA_DIR: /data
    volumes:
      - ./events:/data/events
      - ./recordings:/data/recordings
      - ./snapshots:/data/snapshots
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend-svelte
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
